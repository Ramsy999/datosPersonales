<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Personales</title>
</head>
<body>
    <h1>Datos Personales</h1>
    <script>
        let nombre=prompt("Ingrese su nombre");
        let edad=Number(prompt("Ingrese su edad"));
        let espe=prompt("Ingrese su especialidad");
        let seguro=confirm("deseas registrarte");
        if(seguro){
            document.write("Tu nombre es: "+nombre+"<br>"+"Tu edad es: "+edad+" años"+"<br>"+"Tu especialidad es: "+espe);
        }else{
            document.write(">:)");
        }
        
    </script>
</html>
